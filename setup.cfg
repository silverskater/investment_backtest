[metadata]
name = backtest
version = attr: backtest.__version__

[flake8]
max-line-length = 88
extend-ignore = E203

[yapf]
based_on_style = google
column_limit = 88

[isort]
profile = google
line_length = 88

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
