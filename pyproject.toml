[tool.poetry]
name = "backtest"
version = "0.1.0"
description = ""
authors = ["Anton Ludescher <ludescherantal@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.0"
pandas = "^2.2.3"
requests = "^2.32.3"
click = "^8.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^5.0.0" # Added pytest-cov

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# Investment strategy backtest tool supporting multiple strategies
backtest = "backtest.cli:cli"
# Creates synthetic market data for backtesting investment strategies
generate_example_data = "backtest.example_data:cli"

[tool.pytest.ini_options]
#testpaths = ["tests"]
# Register all custom markers to avoid typos and ensure they are known to pytest.
markers = [
    "unit: unit tests",
    "e2e: end to end tests",
    "skip: slow tests",
    "integration: integration tests",
    # "smoke: smoke tests",
]
# Default command-line options to apply for every run.
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=backtest",
    "--cov-report=term-missing",
    "--cov-report=html",
    # "--no-cov-on-fail", # Optional
    # "-vv",              # Optional
    # "--durations=10",   # Optional
]
# Python files, classes, and functions to be considered as tests.
# The defaults are usually fine (test_*.py, *_test.py for files; Test* for classes; test_* for functions).
# Uncomment and modify if the naming convention differs.
# python_files = "test_*.py *_test.py" # Default, usually not needed
# python_classes = "Test*"             # Default, usually not needed
# python_functions = "test_*"          # Default, usually not needed
# Directories to exclude from test collection.
# Useful for virtual environments, build artifacts, etc.
norecursedirs = [".git", ".venv", ".*", "build", "dist", "*.egg-info"]
# Filter warnings. This can help keep test output clean.
# Example: ignore a specific DeprecationWarning from a specific library.
# filterwarnings = [
#     "ignore::DeprecationWarning:some_library.*:",
#     "error::UserWarning",
# ]
minversion = "8.4"
# Optional: Configure logging output if using Python's 'logging' module.
# log_cli = true
# log_cli_level = "INFO"
# log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
# log_cli_date_format = "%Y-%m-%d %H:%M:%S"
